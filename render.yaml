services:
  - type: web
    name: nexus
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: NEXUS_SECRET
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: GROQ_KEY
        sync: false
      - key: DRONA_URL
        sync: false
      - key: DRONA_PASSWORD
        sync: false
      - key: POE_API_KEY
        sync: false
      - key: PERPLEXITY_TOKEN
        sync: false
      - key: NVIDIA_KEY
        sync: false
      - key: CEREBRAS_KEY
        sync: false
      - key: MISTRAL_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: TAVILY_KEY_1
        sync: false
      - key: TAVILY_KEY_2
        sync: false
      - key: SERPER_KEY_1
        sync: false
      - key: SERPER_KEY_2
        sync: false
      - key: YOUCOM_KEY_1
        sync: false
      - key: YOUCOM_KEY_2
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
