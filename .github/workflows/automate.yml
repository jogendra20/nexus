name: Nexus Automation
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Automation task description'
        required: true
      script_path:
        description: 'Script to run (e.g. scripts/scrape.py)'
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright scrapling
          playwright install chromium
          playwright install-deps chromium

      - name: Run script
        id: run
        run: |
          START=$(date +%s%3N)
          python ${{ github.event.inputs.script_path }} && echo "SUCCESS=true" >> $GITHUB_ENV || echo "SUCCESS=false" >> $GITHUB_ENV
          END=$(date +%s%3N)
          echo "ELAPSED=$((END-START))" >> $GITHUB_ENV
        continue-on-error: true

      - name: Report result to Nexus
        run: |
          curl -X POST ${{ secrets.NEXUS_URL }}/result \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.NEXUS_API_KEY }}" \
            -d "{\"provider\":\"github_models\",\"task\":\"automation\",\"success\":${{ env.SUCCESS }},\"response_time_ms\":${{ env.ELAPSED }}}"
