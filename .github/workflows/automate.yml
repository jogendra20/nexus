name: Nexus Automation
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Automation task description"
        required: true
      script_path:
        description: "Script to run"
        required: true
      difficulty:
        required: false
        default: "easy"
      provider:
        required: false
        default: "unknown"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pandas beautifulsoup4 yfinance lxml playwright scrapling
          playwright install chromium
          playwright install-deps chromium

      - name: Run script
        id: run
        run: |
          set +e
          OUTPUT=$(timeout 300 python ${{ github.event.inputs.script_path }} 2>&1)
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          {
            echo "output<<ENDOFOUTPUT"
            echo "$OUTPUT"
            echo "ENDOFOUTPUT"
          } >> $GITHUB_OUTPUT

      - name: Store output in Nexus
        run: |
          python3 - << PYEOF
          import requests
          status = "done" if "${{ steps.run.outputs.exit_code }}" == "0" else "failed"
          requests.post(
              "${{ secrets.NEXUS_URL }}/store-output",
              headers={"Content-Type": "application/json", "X-API-Key": "${{ secrets.NEXUS_API_KEY }}"},
              json={
                  "run_id": "${{ github.run_id }}",
                  "status": status,
                  "output": """${{ steps.run.outputs.output }}""",
                  "exit_code": int("${{ steps.run.outputs.exit_code }}" or 0),
                  "task": "${{ github.event.inputs.task }}"
              },
              timeout=15
          )
          PYEOF
